---
services:
  traefik:
    image: ${TRAEFIK_IMAGE}
    container_name: mfa-traefik
    restart: unless-stopped
    command:
      - '--api.insecure=true'
      - '--entrypoints.web.address=:80'
      - '--entrypoints.websecure.address=:443'
      - '--entrypoints.websecure.forwardedHeaders.insecure'
      - '--providers.file.directory=/etc/traefik/dynamic'
      - '--accesslog=true'
    ports:
      - '${TRAEFIK_HTTP_PORT}:80'
      - '${TRAEFIK_HTTPS_PORT}:443'
      - '8081:8080'
    volumes:
      - './config/traefik:/etc/traefik/dynamic:ro'
      - './certs:/certs:ro'
    networks:
      - mfa
  mariadb-secondary:
    image: ${MARIADB_IMAGE}
    container_name: mfa-mariadb-secondary
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - '${MARIADB_PORT}:3306'
    volumes:
      - 'mariadb-secondary-data:/var/lib/mysql'
      - './config/mariadb/secondary.cnf:/etc/mysql/conf.d/zz-secondary.cnf:ro'
    networks:
      - mfa
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
  keycloak:
    image: ${KEYCLOAK_IMAGE}
    container_name: mfa-keycloak-secondary
    restart: unless-stopped
    command: start
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: mariadb
      KC_DB_URL_HOST: ${ACTIVE_DB_HOST}
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HTTP_ENABLED: 'true'
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: ${KEYCLOAK_HOST}
      KC_TRUSTSTORE_PATHS: /opt/keycloak/certs/truststore/root-ca.crt
      KC_CACHE: ispn
      KC_CACHE_EMBEDDED_NETWORK_BIND_PORT: '7800'
      KC_CACHE_EMBEDDED_NETWORK_EXTERNAL_ADDRESS: ${SECONDARY_HOST}
      KC_CACHE_EMBEDDED_NETWORK_EXTERNAL_PORT: '7800'
    extra_hosts:
      - "Window-Server-22.khalibre-ad-lab.crosswired.me:192.168.241.49"
    ports:
      - '8080:8080'
      - '7800:7800'
      - '57800:57800'
    volumes:
      - './certs/truststore:/opt/keycloak/certs/truststore:ro'
    networks:
      - mfa
  privacyidea:
    image: ${PRIVACYIDEA_IMAGE}
    container_name: mfa-privacyidea-secondary
    restart: unless-stopped
    environment:
      PI_DB_VENDOR: mariadb
      PI_DB_HOST: ${ACTIVE_DB_HOST}
      PI_DB_NAME: ${PI_DB_NAME}
      PI_DB_USER: ${PI_DB_USER}
      PI_DB_PASSWORD: ${PI_DB_PASSWORD}
      PI_PEPPER: ${PI_PEPPER}
      PI_SECRET_KEY: ${PI_SECRET_KEY}
      PI_ADMIN_USER: ${PI_ADMIN_USER}
      PI_ADMIN_PASSWORD: ${PI_ADMIN_PASSWORD}
      PI_SKIP_BOOTSTRAP: ${PI_SKIP_BOOTSTRAP}
      PI_AUTO_UPDATE: 'false'
      PI_LOGLEVEL: INFO
      PI_SUPERUSER_REALM: ${PI_SUPERUSER_REALM}
    ports:
      - '8082:8080'
    volumes:
      - 'privacyidea-data-secondary:/data/privacyidea'
    networks:
      - mfa

networks:
  mfa:
    name: mfa

volumes:
  mariadb-secondary-data:
  privacyidea-data-secondary:
