[env]
_.file = ".env"

[tasks.deploy]
description = "Provision secrets/certs and deploy both node stacks"
alias = "start"
run = '''
#!/usr/bin/env bash
set -euo pipefail

# Provision (.env, certs, Traefik config, S3 backup) and deploy each node's
# Compose project with Ansible, run from the ansible-ee image.
if [ -f ansible/playbook.yml ] && [ -f ansible/group_vars/all/vault.yml ]; then  
  docker compose -f setup-docker-compose.yml run --rm ansible-ee ansible-playbook ansible/playbook.yml
else
  echo "playbook.yml missing; skipping provisioning." >&2
fi
[ -f .env ] && source .env || true
echo "--------------------------------------------------------"
echo "Keycloak:    https://${KEYCLOAK_HOST}"
echo "PrivacyIDEA: https://${PI_HOST}"
echo "Primary node: ${PRIMARY_HOST}"
echo "Secondary node:  ${SECONDARY_HOST}"
echo "--------------------------------------------------------"

db_file="$(ls -1t databases/mariadb_backup_*.tar.gz 2>/dev/null | head -n1 || true)"
if [ -n "${db_file}" ]; then
  echo ""
  echo "=> A database backup is available at:"
  echo "   ${db_file}"
  echo "=> Restore it into the primary:   mise run db:restore ${db_file}"
  echo "=> Then seed the secondary:          mise run db:seed-secondary"
fi
'''

[tasks.down]
description = "Stop and remove both stacks (keeps volumes)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
source scripts/_remote.sh
remote_primary "cd /opt/docker-compose && sudo docker compose -p mfa -f docker-compose.primary.yml down"
remote_secondary  "cd /opt/docker-compose && sudo docker compose -p mfa -f docker-compose.secondary.yml down"
'''

[tasks.stop]
description = "Stop both stacks"
run = '''
#!/usr/bin/env bash
set -euo pipefail
source scripts/_remote.sh
remote_primary "cd /opt/docker-compose && sudo docker compose -p mfa -f docker-compose.primary.yml stop"
remote_secondary  "cd /opt/docker-compose && sudo docker compose -p mfa -f docker-compose.secondary.yml stop"
'''

[tasks.restart]
description = "Restart both stacks"
run = '''
#!/usr/bin/env bash
set -euo pipefail
source scripts/_remote.sh
remote_primary "cd /opt/docker-compose && sudo docker compose -p mfa -f docker-compose.primary.yml restart"
remote_secondary  "cd /opt/docker-compose && sudo docker compose -p mfa -f docker-compose.secondary.yml restart"
'''

[tasks."logs:keycloak1"]
description = "Follow Keycloak 1 logs (primary node)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
source scripts/_remote.sh
remote_primary docker logs -f mfa-keycloak-primary
'''

[tasks."logs:keycloak2"]
description = "Follow Keycloak 2 logs (secondary node)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
source scripts/_remote.sh
remote_secondary docker logs -f mfa-keycloak-secondary
'''

[tasks."logs:privacyidea"]
description = "Follow PrivacyIDEA logs (primary node)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
source scripts/_remote.sh
remote_primary docker logs -f mfa-privacyidea
'''

[tasks."logs:mariadb-primary"]
description = "Follow MariaDB primary logs (primary node)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
source scripts/_remote.sh
remote_primary docker logs -f mfa-mariadb-primary
'''

[tasks."logs:mariadb-secondary"]
description = "Follow MariaDB secondary logs (secondary node)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
source scripts/_remote.sh
remote_secondary docker logs -f mfa-mariadb-secondary
'''

[tasks."logs:traefik"]
description = "Follow Traefik logs (primary node)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
source scripts/_remote.sh
remote_primary docker logs -f mfa-traefik
'''

[tasks.ps]
description = "List containers on both nodes"
run = '''
#!/usr/bin/env bash
set -euo pipefail
source scripts/_remote.sh
echo "=== ${PRIMARY_HOST} (primary) ==="
remote_primary docker ps
echo "=== ${SECONDARY_HOST} (secondary) ==="
remote_secondary docker ps
'''

[tasks.pull]
description = "Pull images on both nodes"
run = '''
#!/usr/bin/env bash
set -euo pipefail
source scripts/_remote.sh
remote_primary "cd /opt/docker-compose && sudo docker compose -p mfa -f docker-compose.primary.yml pull"
remote_secondary  "cd /opt/docker-compose && sudo docker compose -p mfa -f docker-compose.secondary.yml pull"
'''

[tasks.destroy]
description = "Remove both stacks, volumes, generated certs and DB backups"
alias = "destroy"
run = '''
#!/usr/bin/env bash
set -euo pipefail
source scripts/_remote.sh
remote_primary "cd /opt/docker-compose && sudo docker compose -p mfa -f docker-compose.primary.yml down -v" || true
remote_secondary  "cd /opt/docker-compose && sudo docker compose -p mfa -f docker-compose.secondary.yml down -v" || true
rm -f certs/wildcard.crt certs/wildcard.key certs/truststore/*.crt
rm -f .env config/traefik/dynamic.yml
rm -rf databases/*.tar.gz
echo "Removed both stacks, volumes, generated configs, certificates and DB backups."
'''

[tasks.clean]
description = "Clean up local project configuration"
run = '''
#!/usr/bin/env bash
rm -f certs/wildcard.crt certs/wildcard.key certs/truststore/*.crt
rm -f .env config/traefik/dynamic.yml
rm -rf databases/*.tar.gz
'''

[tasks."db:export"]
description = "Export all MariaDB databases to a compressed tar.gz in databases/"
run = '''
#!/usr/bin/env bash
set -euo pipefail
source scripts/_remote.sh
mkdir -p databases
timestamp=$(date +"%Y%m%d_%H%M%S")
sqlfile="mariadb_backup_${timestamp}.sql"
tarfile="databases/mariadb_backup_${timestamp}.tar.gz"
echo "Exporting databases from ${PRIMARY_HOST}..."
remote_primary "docker exec mfa-mariadb-primary mariadb-dump -uroot -p'${MYSQL_ROOT_PASSWORD}' --all-databases" > "databases/${sqlfile}"
echo "Compressing to ${tarfile}..."
tar -czvf "${tarfile}" -C databases "${sqlfile}"
rm "databases/${sqlfile}"
echo "Export complete: ${tarfile}"
'''

[tasks."db:restore"]
description = "Restore a tar.gz backup into mariadb-primary (then run db:seed-secondary)"
run = "scripts/restore-primary.sh \"$@\""

[tasks."db:seed-secondary"]
description = "Seed mariadb-secondary from mariadb-primary and start GTID replication"
run = "scripts/seed-secondary.sh"

[tasks."db:failover"]
description = "Promote mariadb-secondary to primary and reconfigure mariadb-primary as secondary"
run = "scripts/failover.sh"

[tasks."db:failback"]
description = "Reconfigure mariadb-primary as secondary and reconfigure mariadb-secondary as primary"
run = "scripts/failback.sh"
