[tasks."db:export"]
description = "Take a full physical PXC backup into databases/export"
run = '''
#!/usr/bin/env bash
set -euo pipefail
set -a; source .env; set +a

backup_tool="mariabackup"
if ! docker exec mfa-pxc sh -c 'command -v mariabackup >/dev/null 2>&1'; then
  if docker exec mfa-pxc sh -c 'command -v xtrabackup >/dev/null 2>&1'; then
    backup_tool="xtrabackup"
  else
    echo "Error: neither 'mariabackup' nor 'xtrabackup' was found in mfa-pxc (image: ${PXC_IMAGE})."
    exit 1
  fi
fi

if ! docker exec mfa-pxc sh -c 'command -v tar >/dev/null 2>&1'; then
  echo "Error: 'tar' not found in mfa-pxc (image: ${PXC_IMAGE})."
  exit 1
fi

mkdir -p databases/export
timestamp=$(date +"%Y%m%d_%H%M%S")
backup_dir="/tmp/pxc_backup_${timestamp}"
tarfile="databases/export/pxc_fullbackup_${timestamp}.tar.gz"

echo "Taking full physical backup..."
docker exec mfa-pxc "${backup_tool}" \
  --backup \
  --target-dir="${backup_dir}" \
  --user=root \
  --password="${MYSQL_ROOT_PASSWORD}"

echo "Preparing backup..."
docker exec mfa-pxc "${backup_tool}" \
  --prepare \
  --target-dir="${backup_dir}"

echo "Compressing to ${tarfile}..."
docker exec mfa-pxc tar -czf "${backup_dir}.tar.gz" -C "$(dirname "${backup_dir}")" "$(basename "${backup_dir}")"
docker cp "mfa-pxc:${backup_dir}.tar.gz" "${tarfile}"
docker exec mfa-pxc rm -rf "${backup_dir}" "${backup_dir}.tar.gz"

echo "Full backup complete: ${tarfile}"
'''

[tasks."db:restore"]
description = "Restore PXC databases from a compressed tar.gz file"
run = '''
#!/usr/bin/env bash
set -euo pipefail
set -a; source .env; set +a

if [ $# -eq 0 ]; then
  infile="$(ls -t databases/*.tar.gz databases/export/*.tar.gz 2>/dev/null | head -n1 || true)"
  if [ -z "${infile}" ]; then
    echo "Error: No backup file given and none found in databases/ or databases/export/"
    echo "Usage: mise run db:restore [backup_file.tar.gz]"
    exit 1
  fi
  echo "No file specified; using most recent backup: ${infile}"
else
  infile="$1"
fi

if [ ! -f "${infile}" ]; then
  echo "Error: File not found: ${infile}"
  exit 1
fi

echo "Inspecting backup format in ${infile}..."
is_physical="false"
if tar -ztf "${infile}" 2>/dev/null | grep -E "xtrabackup_checkpoints|backup-my.cnf" | head -n1 | grep -q .; then
  is_physical="true"
fi

if [ "${is_physical}" = "true" ]; then
  backup_entry="$(tar -ztf "${infile}" 2>/dev/null | awk -F/ 'NR==1{print $1}')"
  restore_image="${PXC_IMAGE}"

  if docker run --rm "${restore_image}" sh -c 'command -v mariabackup >/dev/null 2>&1'; then
    restore_tool="mariabackup"
  elif docker run --rm "${restore_image}" sh -c 'command -v xtrabackup >/dev/null 2>&1'; then
    restore_tool="xtrabackup"
  else
    echo "Error: neither 'mariabackup' nor 'xtrabackup' was found in ${restore_image}."
    exit 1
  fi

  echo "Stopping local services..."
  docker compose stop keycloak privacyidea pxc || true

  echo "Restoring physical backup directly to local PXC volume..."
  docker run --rm \
    -v multifactor-authentication_pxc-data:/var/lib/mysql \
    -v "$(readlink -f "${infile}"):/tmp/backup.tar.gz:ro" \
    "${restore_image}" \
    bash -c "
      set -euo pipefail
      mkdir -p /tmp/pxc_restore
      tar -xzf /tmp/backup.tar.gz -C /tmp/pxc_restore
      target_dir=\"/tmp/pxc_restore\"
      if [ -d \"/tmp/pxc_restore/${backup_entry}\" ]; then
        target_dir=\"/tmp/pxc_restore/${backup_entry}\"
      fi
      find /var/lib/mysql -mindepth 1 -delete
      ${restore_tool} --copy-back --target-dir=\"\${target_dir}\"
      chown -R mysql:mysql /var/lib/mysql
      rm -rf /tmp/pxc_restore
    "

  docker compose start pxc
else
  echo "Detected logical SQL backup."
  tmp_sql="$(mktemp --suffix=.sql)"
  trap 'rm -f "${tmp_sql}"' EXIT
  tar -xzvOf "${infile}" > "${tmp_sql}"

  for db in "${KEYCLOAK_DB_NAME}" "${PI_DB_NAME}"; do
    echo "  -> restoring ${db}"
    docker exec -i mfa-pxc mysql -uroot -p"${MYSQL_ROOT_PASSWORD}" --one-database "${db}" < "${tmp_sql}"
  done
fi

echo "Restore complete. Waiting for local mfa-pxc to report healthy..."
for _ in $(seq 1 30); do
  status="$(docker inspect mfa-pxc 2>/dev/null | jq -r '.[0].State.Health.Status // "starting"')"
  if [ "${status}" = "healthy" ]; then
    docker compose start keycloak privacyidea || true
    echo "mfa-pxc is healthy."
    exit 0
  fi
  sleep 2
done

echo "Warning: mfa-pxc did not report healthy within 60s; check 'docker logs mfa-pxc'."
'''
