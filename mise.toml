[env]
_.file = ".env"

[tasks.sync]
description = "Sync project files and render node-specific config on all cluster nodes"
run = '''
#!/usr/bin/env bash
set -euo pipefail
docker compose -f setup-docker-compose.yml run --rm ansible-ee \
  ansible-playbook ansible/playbook.yml --tags vault,certs,env,copy
'''

[tasks."sync:node1"]
description = "Sync project files and render node1 config"
run = '''
#!/usr/bin/env bash
set -euo pipefail
docker compose -f setup-docker-compose.yml run --rm ansible-ee \
  ansible-playbook ansible/playbook.yml --tags vault,certs,env,copy -l localhost,node1
'''

[tasks."sync:node2"]
description = "Sync project files and render node2 config"
run = '''
#!/usr/bin/env bash
set -euo pipefail
docker compose -f setup-docker-compose.yml run --rm ansible-ee \
  ansible-playbook ansible/playbook.yml --tags vault,certs,env,copy -l localhost,node2
'''

[tasks."deploy:node1"]
description = "Start/update remote services on node1"
run = '''
#!/usr/bin/env bash
set -euo pipefail
docker compose -f setup-docker-compose.yml run --rm ansible-ee \
  ansible-playbook ansible/playbook.yml --tags deploy -l node1
'''

[tasks."deploy:node2"]
description = "Start/update remote services on node2"
run = '''
#!/usr/bin/env bash
set -euo pipefail
docker compose -f setup-docker-compose.yml run --rm ansible-ee \
  ansible-playbook ansible/playbook.yml --tags deploy -l node2
'''

[tasks."deploy:cluster"]
description = "Sync and deploy the two-node cluster in bootstrap/join order"
run = '''
#!/usr/bin/env bash
set -euo pipefail

echo "Generating Vault-backed environment and certificates on controller..."
docker compose -f setup-docker-compose.yml run --rm ansible-ee \
  ansible-playbook ansible/playbook.yml --tags vault,certs,env

echo "Syncing project files and rendering node-specific config..."
docker compose -f setup-docker-compose.yml run --rm ansible-ee \
  ansible-playbook ansible/playbook.yml --tags copy

echo "Starting node1 bootstrap services (PXC, Traefik, Keycloak)..."
docker compose -f setup-docker-compose.yml run --rm ansible-ee \
  ansible-playbook ansible/playbook.yml --tags deploy -l node1 \
    -e '{"compose_services":["pxc","traefik","keycloak"]}'

echo "Waiting for node1 PXC to become healthy and Synced..."
docker compose -f setup-docker-compose.yml run --rm ansible-ee \
  ansible-playbook ansible/playbook.yml --tags pxc_wait -l node1

echo "Waiting for node1 Keycloak readiness before starting PrivacyIDEA..."
docker compose -f setup-docker-compose.yml run --rm ansible-ee \
  ansible-playbook ansible/playbook.yml --tags keycloak_wait -l node1

echo "Starting remaining services on node1..."
docker compose -f setup-docker-compose.yml run --rm ansible-ee \
  ansible-playbook ansible/playbook.yml --tags deploy -l node1

echo "Starting services on node2..."
docker compose -f setup-docker-compose.yml run --rm ansible-ee \
  ansible-playbook ansible/playbook.yml --tags deploy -l node2

echo "Verifying two-node cluster health..."
docker compose -f setup-docker-compose.yml run --rm ansible-ee \
  ansible-playbook ansible/playbook.yml --tags cluster_verify
'''

[tasks."cluster:status"]
description = "Show container and PXC status on both nodes"
run = '''
#!/usr/bin/env bash
set -euo pipefail
docker compose -f setup-docker-compose.yml run --rm ansible-ee \
