---
name: multifactor-authentication

services:
  #
  # Reverse proxy
  # Dashboard: http://localhost:${TRAEFIK_DASHBOARD_PORT}
  #
  traefik:
    image: ${TRAEFIK_IMAGE}
    container_name: mfa-traefik
    restart: unless-stopped
    command:
      - '--api.insecure=true'
      - '--entrypoints.web.address=:80'
      - '--entrypoints.websecure.address=:443'
      - '--entrypoints.websecure.forwardedHeaders.insecure'
      - '--providers.docker=true'
      - '--providers.docker.exposedbydefault=false'
      - '--providers.docker.constraints=Label(`multifactor-authentication.project`,`true`)'
      - '--providers.file.directory=/etc/traefik/dynamic'
      - '--ping=true'
      - '--ping.entrypoint=web'
    ports:
      - '${TRAEFIK_HTTP_PORT}:80'
      - '${TRAEFIK_HTTPS_PORT}:443'
      - '${TRAEFIK_DASHBOARD_PORT}:8080'
    volumes:
      - '/var/run/docker.sock:/var/run/docker.sock:ro'
      - './config/traefik:/etc/traefik/dynamic:ro'
      - './certs:/certs:ro'
    networks:
      - mfa-network

  #
  # Percona XtraDB Cluster database (Keycloak + PrivacyIDEA)
  #
  pxc:
    image: ${PXC_IMAGE:-percona/percona-xtradb-cluster:8.0}
    entrypoint: ['/bin/bash', '/usr/local/bin/pxc-entrypoint.sh']
    command: ['mysqld']
    container_name: mfa-pxc
    restart: unless-stopped
    network_mode: host
    deploy:
      resources:
        limits: { memory: 3G }
        reservations: { memory: 1.5G }
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${KEYCLOAK_DB_NAME}
      MYSQL_USER: ${KEYCLOAK_DB_USER}
      MYSQL_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      PI_DB_NAME: ${PI_DB_NAME}
      PI_DB_USER: ${PI_DB_USER}
      PI_DB_PASSWORD: ${PI_DB_PASSWORD}
      CLUSTER_NAME: ${PXC_CLUSTER_NAME:-mfa-pxc-cluster}
      CLUSTER_JOIN: ${PXC_CLUSTER_JOIN:-}
      XTRABACKUP_PASSWORD: ${PXC_SST_PASSWORD:-sstpassword123}
    volumes:
      - 'pxc-data:/var/lib/mysql'
      - './config/bin/pxc-entrypoint.sh:/usr/local/bin/pxc-entrypoint.sh:ro'
      - './config/pxc/initdb:/docker-entrypoint-initdb.d:ro'
      - './config/pxc/custom.cnf:/etc/percona-xtradb-cluster.conf.d/custom.cnf:ro'
      - './config/pxc/init.cnf:/etc/percona-xtradb-cluster.conf.d/zz-init.cnf:ro'
    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysql --protocol=TCP -h 127.0.0.1 -uroot --connect-timeout=3 -Nse "SELECT 1"'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20m

  #
  # Keycloak
  # URL: https://${KEYCLOAK_HOST}
  #
  keycloak:
    image: ${KEYCLOAK_IMAGE}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mfa-keycloak
    restart: unless-stopped
    entrypoint: ['/bin/bash', '-ec']
    command:
      - |
        /usr/local/bin/wait-for-tcp.sh ${PXC_CLIENT_HOST:?PXC_CLIENT_HOST is required} 3306 120
        exec /opt/keycloak/bin/kc.sh start --optimized
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://${PXC_CLIENT_HOST:?PXC_CLIENT_HOST is required}:3306/${KEYCLOAK_DB_NAME}?nullCatalogMeansCurrent=true
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: ${KEYCLOAK_HOST}
      KC_HOSTNAME_STRICT: 'false'
      KC_HEALTH_ENABLED: 'true'
      KC_CACHE: ispn
      KC_CACHE_STACK: jdbc-ping
      JAVA_OPTS_APPEND: "-Djgroups.external_addr=${KEYCLOAK_NODE_ADDRESS:?KEYCLOAK_NODE_ADDRESS is required} -Djgroups.fd.external_addr=${KEYCLOAK_NODE_ADDRESS:?KEYCLOAK_NODE_ADDRESS is required}"
      KC_TRUSTSTORE_PATHS: /opt/keycloak/certs/truststore/root-ca.crt
    ports:
      - '7800:7800'
      - '57800:57800'
    ##
    # Add extra hosts for keycloak to resolve to the adfs server
    ##
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "Window-Server-22.khalibre-ad-lab.crosswired.me:192.168.241.49"
    volumes:
      - './certs/truststore:/opt/keycloak/certs/truststore:ro'
      - './config/bin/wait-for-tcp.sh:/usr/local/bin/wait-for-tcp.sh:ro'
    labels:
      - 'multifactor-authentication.project=true'
      - 'traefik.enable=true'
      - 'traefik.http.middlewares.redirect-middleware.redirectscheme.scheme=https'
      - 'traefik.http.routers.keycloak-secure.entrypoints=websecure'
      - 'traefik.http.routers.keycloak-secure.rule=Host(`${KEYCLOAK_HOST}`)'
      - 'traefik.http.routers.keycloak-secure.service=keycloak-secure'
      - 'traefik.http.routers.keycloak-secure.tls=true'
      - 'traefik.http.routers.keycloak.entrypoints=web'
      - 'traefik.http.routers.keycloak.middlewares=redirect-middleware'
      - 'traefik.http.routers.keycloak.rule=Host(`${KEYCLOAK_HOST}`)'
      - 'traefik.http.routers.keycloak.service=keycloak'
      - 'traefik.http.services.keycloak-secure.loadbalancer.server.port=8080'
      - 'traefik.http.services.keycloak.loadbalancer.server.port=8080'
    networks:
      - mfa-network
    depends_on:
      pxc:
        condition: service_healthy

  #
  # PrivacyIDEA
  # URL: https://${PI_HOST}
  #
  privacyidea:
    image: ${PRIVACYIDEA_IMAGE}
    container_name: mfa-privacyidea
    restart: unless-stopped
    entrypoint: ['/bin/bash', '-ec']
    command:
      - |
        /usr/local/bin/wait-for-tcp.sh ${PXC_CLIENT_HOST:?PXC_CLIENT_HOST is required} 3306 120
        exec /usr/bin/tini -- /usr/local/bin/privacyidea_entrypoint.sh
    environment:
      PI_DB_VENDOR: mysql
      PI_DB_URL: jdbc:mysql://${PXC_CLIENT_HOST:?PXC_CLIENT_HOST is required}:3306/${PI_DB_NAME}?nullCatalogMeansCurrent=true
      PI_PEPPER: ${PI_PEPPER}
      PI_SECRET_KEY: ${PI_SECRET_KEY}
      PI_ADMIN_USER: ${PI_ADMIN_USER}
      PI_ADMIN_PASSWORD: ${PI_ADMIN_PASSWORD}
      PI_SKIP_BOOTSTRAP: ${PI_SKIP_BOOTSTRAP:-false}
      PI_AUTO_UPDATE: 'false'
      PI_LOGLEVEL: INFO
      PI_SUPERUSER_REALM: ${PI_SUPERUSER_REALM}
      PI_ENCFILE: /etc/privacyidea/encfile
    volumes:
      - './config/privacyidea/keys:/data/privacyidea/keys'
      - './config/privacyidea/keys/encfile:/etc/privacyidea/encfile:ro'
      - './config/privacyidea/scripts:/mnt/privacyidea/scripts:ro'
      - './config/bin/wait-for-tcp.sh:/usr/local/bin/wait-for-tcp.sh:ro'
    extra_hosts:
      - "host.docker.internal:host-gateway"

    labels:
      - 'multifactor-authentication.project=true'
      - 'traefik.enable=true'
      - 'traefik.http.middlewares.redirect-middleware.redirectscheme.scheme=https'
      - 'traefik.http.routers.pi-secure.entrypoints=websecure'
      - 'traefik.http.routers.pi-secure.rule=Host(`${PI_HOST}`)'
      - 'traefik.http.routers.pi-secure.service=pi-secure'
      - 'traefik.http.routers.pi-secure.tls=true'
      - 'traefik.http.routers.pi.entrypoints=web'
      - 'traefik.http.routers.pi.middlewares=redirect-middleware'
      - 'traefik.http.routers.pi.rule=Host(`${PI_HOST}`)'
      - 'traefik.http.routers.pi.service=pi'
      - 'traefik.http.services.pi-secure.loadbalancer.server.port=8080'
      - 'traefik.http.services.pi.loadbalancer.server.port=8080'
    networks:
      - mfa-network
    depends_on:
      pxc:
        condition: service_healthy

networks:
  mfa-network:
    driver: bridge

volumes:
  pxc-data:
