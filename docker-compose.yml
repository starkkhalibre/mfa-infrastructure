---
name: multifactor-authentication

services:
  #
  # Reverse proxy
  # Dashboard: http://localhost:${TRAEFIK_DASHBOARD_PORT}
  #
  traefik:
    image: ${TRAEFIK_IMAGE}
    container_name: mfa-traefik
    restart: unless-stopped
    command:
      - '--api.insecure=true'
      - '--entrypoints.web.address=:80'
      - '--entrypoints.websecure.address=:443'
      - '--entrypoints.websecure.forwardedHeaders.insecure'
      - '--providers.docker=true'
      - '--providers.docker.exposedbydefault=false'
      - '--providers.docker.constraints=Label(`multifactor-authentication.project`,`true`)'
      - '--providers.file.directory=/etc/traefik/dynamic'
    ports:
      - '${TRAEFIK_HTTP_PORT}:80'
      - '${TRAEFIK_HTTPS_PORT}:443'
      - '${TRAEFIK_DASHBOARD_PORT}:8080'
    volumes:
      - '/var/run/docker.sock:/var/run/docker.sock:ro'
      - './config/traefik:/etc/traefik/dynamic:ro'
      - './certs:/certs:ro'
    networks:
      mfa-network:
        ipv4_address: 10.100.100.10

  #
  # MariaDB database (Keycloak + PrivacyIDEA)
  #
  mariadb:
    image: ${MARIADB_IMAGE}
    container_name: mfa-mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${KEYCLOAK_DB_NAME}
      MYSQL_USER: ${KEYCLOAK_DB_USER}
      MYSQL_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      PI_DB_NAME: ${PI_DB_NAME}
      PI_DB_USER: ${PI_DB_USER}
      PI_DB_PASSWORD: ${PI_DB_PASSWORD}
      MARIADB_AUTO_UPGRADE: 1
    ports:
      - '${MARIADB_PORT}:3306'
    volumes:
      - 'mariadb-data:/var/lib/mysql'
      - './config/mariadb/initdb:/docker-entrypoint-initdb.d:ro'
    networks:
      - mfa-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  #
  # Keycloak
  # URL: https://${KEYCLOAK_HOST}
  #
  keycloak:
    image: ${KEYCLOAK_IMAGE}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mfa-keycloak
    restart: unless-stopped
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: mariadb
      KC_DB_URL_HOST: mariadb
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: ${KEYCLOAK_HOST}
      KC_HOSTNAME_STRICT: 'false'
      KC_TRUSTSTORE_PATHS: /opt/keycloak/certs/truststore/root-ca.crt
    ##
    # Add extra hosts for keycloak to resolve to the adfs server
    ##
    extra_hosts:
      - "Window-Server-22.khalibre-ad-lab.crosswired.me:192.168.241.49"
    volumes:
      - './certs/truststore:/opt/keycloak/certs/truststore:ro'
    labels:
      - 'multifactor-authentication.project=true'
      - 'traefik.enable=true'
      - 'traefik.http.middlewares.redirect-middleware.redirectscheme.scheme=https'
      - 'traefik.http.routers.keycloak-secure.entrypoints=websecure'
      - 'traefik.http.routers.keycloak-secure.rule=Host(`${KEYCLOAK_HOST}`)'
      - 'traefik.http.routers.keycloak-secure.service=keycloak-secure'
      - 'traefik.http.routers.keycloak-secure.tls=true'
      - 'traefik.http.routers.keycloak.entrypoints=web'
      - 'traefik.http.routers.keycloak.middlewares=redirect-middleware'
      - 'traefik.http.routers.keycloak.rule=Host(`${KEYCLOAK_HOST}`)'
      - 'traefik.http.routers.keycloak.service=keycloak'
      - 'traefik.http.services.keycloak-secure.loadbalancer.server.port=8080'
      - 'traefik.http.services.keycloak.loadbalancer.server.port=8080'
    networks:
      - mfa-network
    depends_on:
      mariadb:
        condition: service_healthy

  #
  # PrivacyIDEA
  # URL: https://${PI_HOST}
  #
  privacyidea:
    image: ${PRIVACYIDEA_IMAGE}
    container_name: mfa-privacyidea
    restart: unless-stopped
    environment:
      PI_DB_VENDOR: mariadb
      PI_DB_HOST: mariadb
      PI_DB_NAME: ${PI_DB_NAME}
      PI_DB_USER: ${PI_DB_USER}
      PI_DB_PASSWORD: ${PI_DB_PASSWORD}
      PI_PEPPER: ${PI_PEPPER}
      PI_SECRET_KEY: ${PI_SECRET_KEY}
      PI_ADMIN_USER: ${PI_ADMIN_USER}
      PI_ADMIN_PASSWORD: ${PI_ADMIN_PASSWORD}
      PI_SKIP_BOOTSTRAP: ${PI_SKIP_BOOTSTRAP}
      PI_AUTO_UPDATE: 'false'
      PI_LOGLEVEL: INFO
      PI_SUPERUSER_REALM: ${PI_SUPERUSER_REALM}
      PI_ENCFILE: /etc/privacyidea/encfile
    volumes:
      - 'privacyidea-data:/data/privacyidea'
      - './config/privacyidea/keys/encfile:/etc/privacyidea/encfile:ro'
      - './config/privacyidea/scripts:/mnt/privacyidea/scripts:ro'

    labels:
      - 'multifactor-authentication.project=true'
      - 'traefik.enable=true'
      - 'traefik.http.middlewares.redirect-middleware.redirectscheme.scheme=https'
      - 'traefik.http.routers.pi-secure.entrypoints=websecure'
      - 'traefik.http.routers.pi-secure.rule=Host(`${PI_HOST}`)'
      - 'traefik.http.routers.pi-secure.service=pi-secure'
      - 'traefik.http.routers.pi-secure.tls=true'
      - 'traefik.http.routers.pi.entrypoints=web'
      - 'traefik.http.routers.pi.middlewares=redirect-middleware'
      - 'traefik.http.routers.pi.rule=Host(`${PI_HOST}`)'
      - 'traefik.http.routers.pi.service=pi'
      - 'traefik.http.services.pi-secure.loadbalancer.server.port=8080'
      - 'traefik.http.services.pi.loadbalancer.server.port=8080'
    networks:
      - mfa-network
    depends_on:
      mariadb:
        condition: service_healthy

networks:
  mfa-network:
    ipam:
      config:
        - subnet: 10.100.100.0/24

volumes:
  mariadb-data:
  privacyidea-data:
